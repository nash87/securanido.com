<!DOCTYPE html>
<!-- securanido.com — 404. Static, self-contained, no external requests. -->
<html lang="en" data-brand="securanido" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>securanido — room not found</title>
  <meta name="theme-color" content="#0a0908">
  <meta name="color-scheme" content="dark">
  <style>
    :root{
      --sn-canvas:#0a0908; --sn-surface:#15110c; --sn-gold:#f5b042;
      --sn-fg1:#f5e6c8; --sn-fg2:#c9b89a; --sn-fg3:#9a8a6e; --sn-fg4-text:#8c7e60;
      --sn-hair:rgba(245,230,200,0.12);
      --sn-sans:'Geist','Geist Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
      --sn-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
      --sn-ease:cubic-bezier(0.22,1,0.36,1);
    }
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:var(--sn-canvas);color:var(--sn-fg1);font-family:var(--sn-sans);
      -webkit-font-smoothing:antialiased;padding:clamp(20px,5vw,72px);text-align:center}
    a{color:inherit;text-decoration:none}
    :focus{outline:none}
    :focus-visible{outline:2px solid var(--sn-gold);outline-offset:2px;border-radius:3px}
    main{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:520px}
    .orb{width:96px;height:96px;border-radius:50%;
      background:
        radial-gradient(circle at 36% 30%, #ffe9c2 0%, #f7bd55 20%, #ec9a37 46%, #b35e1f 72%, #5e2f10 92%),
        radial-gradient(circle at 50% 118%, rgba(0,0,0,0.6), transparent 58%);
      box-shadow:inset 0 0 26px 4px rgba(120,50,8,0.5)}
    .code{font-family:var(--sn-mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--sn-gold)}
    h1{margin:0;font-size:clamp(26px,4vw,38px);font-weight:600;letter-spacing:-.02em;line-height:1.1}
    p{margin:0;font-size:16px;line-height:1.55;color:var(--sn-fg2);max-width:34em}
    .home{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 22px;margin-top:6px;
      background:var(--sn-gold);color:#0a0908;border-radius:9999px;
      font-family:var(--sn-mono);font-size:14px;font-weight:600;
      transition:background .2s var(--sn-ease),box-shadow .2s var(--sn-ease)}
    .home:hover{background:#f7bd55;box-shadow:0 0 0 4px rgba(245,176,66,0.16)}
    .meta{font-family:var(--sn-mono);font-size:12px;color:var(--sn-fg4-text);margin-top:8px}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main>
    <div class="orb" aria-hidden="true"></div>
    <p class="code">404 · room not found</p>
    <h1>This room doesn&rsquo;t exist.</h1>
    <p>The page you were looking for isn&rsquo;t here. The dwelling is still being built — slowly, on purpose.</p>
    <a class="home" href="/">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      back home
    </a>
    <p class="meta">securanido · <span lang="zh-Hans">暖居</span> nuǎn jū · Apache-2.0</p>
  </main>
</body>
</html>
